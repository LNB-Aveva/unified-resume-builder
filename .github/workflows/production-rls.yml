name: Production RLS Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-rls-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production cross-user isolation
    runs-on: ubuntu-latest
    environment: production-rls
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Verify protected environment configuration
        shell: pwsh
        run: |
          $required = 'SUPABASE_URL', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY'
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing) {
            throw "Missing production-rls environment secrets: $($missing -join ', ')"
          }
          if ($env:SUPABASE_URL -ne 'https://pagdtcttkviglyoeuagy.supabase.co') {
            throw 'SUPABASE_URL does not match the approved production project.'
          }

      - name: Install production and test dependencies
        shell: pwsh
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run production RLS isolation suite
        shell: pwsh
        working-directory: backend
        run: python -m pytest tests/integration/test_rls_isolation.py -v --no-header

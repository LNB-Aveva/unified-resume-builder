# render.yaml — Render Infrastructure as Code (Blueprint)
#
# WHAT THIS FILE DOES:
#   Render.com reads this file to automatically configure your web service.
#   Instead of clicking through the Render dashboard every time, this file
#   describes exactly how to build and run the backend. This is called
#   "Infrastructure as Code" — your deployment config lives in git, not
#   hidden in a UI that's hard to reproduce.
#
# HOW TO USE:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo — Render finds this file automatically
#   4. Set the required environment variables when prompted
#      (HUGGINGFACE_API_KEY, FRONTEND_URL, SUPABASE_URL,
#       SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET)
#   5. Deploy — Render runs buildCommand, then startCommand
#
# STARTER PLAN NOTES:
#   - Approved fixed launch cost: $7/month (DEC-030)
#   - Always on; avoids the Free plan's idle spin-down and cold-start delay
#   - 512 MB RAM — sufficient for FastAPI + the current lightweight NLP/PDF stack

services:
  - type: web
    name: unified-resume-builder-api
    runtime: python
    rootDir: backend

    # BUILD COMMAND — runs once on every deploy
    buildCommand: "pip install -r requirements.txt"

    # START COMMAND — runs the live server
    # $PORT is injected by Render — never hardcode a port in production.
    # Render's load balancer routes external traffic to whatever port this process listens on.
    # NOTE: we deliberately do NOT pass uvicorn --proxy-headers/--forwarded-allow-ips="*".
    # That mode trusts the LEFTMOST X-Forwarded-For entry, which is client-supplied and
    # spoofable, letting an attacker forge a new rate-limit bucket per request. Instead,
    # app.core.rate_limit.get_client_ip reads the RIGHTMOST (Render-appended) XFF entry.
    # If Render ever adds more proxy hops, set TRUSTED_PROXY_HOPS accordingly.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    # Keep this aligned with DEC-030. Setting `free` here can downgrade the
    # Blueprint-managed service during a sync and reintroduce cold starts.
    plan: starter

    # Health check — Render pings this every 30s.
    # If it returns non-200, Render restarts the service automatically.
    healthCheckPath: /health

    envVars:
      # sync: false = "user must provide this value in the Render dashboard"
      # Never commit real API keys to git — this forces you to set them securely.
      - key: HUGGINGFACE_API_KEY
        sync: false

      # Your Vercel frontend URL — needed so the backend's CORS policy
      # allows requests from the production frontend.
      # Example: https://unified-resume-builder.vercel.app
      - key: FRONTEND_URL
        sync: false

      # Public Supabase project URL — REQUIRED for current ES256 JWT verification.
      - key: SUPABASE_URL
        sync: false

      # Server-only key used to call the backend-only atomic quota RPC.
      # Never expose this value to the frontend or logs.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Legacy HS256 verification fallback. Keep during signing-key migration;
      # current ES256 tokens are verified through the public JWKS endpoint.
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Sentry error reporting DSN (optional but recommended).
      - key: SENTRY_DSN
        sync: false

      # Marks the deployment as production (enables HSTS, hides /docs).
      - key: ENV
        value: "production"

      # Production fails closed before provider calls if the quota RPC is unavailable.
      - key: AI_QUOTA_ENFORCEMENT
        value: "true"

      - key: PYTHON_VERSION
        value: "3.13.0"

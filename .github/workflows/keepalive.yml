name: Keepalive

on:
  schedule:
    # Every 13 minutes — keeps Render free-tier awake (sleeps after 15 min idle).
    # UptimeRobot handles uptime alerting; this workflow only prevents cold starts.
    - cron: "*/13 * * * *"

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render backend
        run: |
          # Render free-tier cold starts can take 50-90s.
          # Retry up to 3 times with increasing timeouts before failing.
          for attempt in 1 2 3; do
            status=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" --max-time 90 "${BACKEND_URL}/health" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status — retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend health check failed after 3 attempts (last HTTP $status)"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://unified-resume-builder-api.onrender.com' }}

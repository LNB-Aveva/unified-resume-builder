# ci.yml — Continuous Integration pipeline
#
# WHAT CI MEANS:
#   "Continuous Integration" — every push to the repo automatically runs a
#   suite of checks. If anything fails, GitHub shows a red X on the PR and
#   blocks merging. This catches broken code before it reaches main.
#
# WHEN THIS RUNS:
#   - Every push to any branch
#   - Every pull request opened against main
#
# TWO PARALLEL JOBS:
#   backend  — verifies Python imports and that the FastAPI app starts
#   frontend — verifies TypeScript types and that Next.js builds cleanly
#
# WHY PARALLEL JOBS?
#   The backend job takes ~30s (pip install).
#   The frontend job takes ~30s (npm install + build).
#   Running them in parallel means total CI time = max(60s, 30s) = 60s,
#   not 90s. GitHub Actions bills by compute-minutes, so parallelism
#   saves money too (important once you're on a paid plan).
#
# GITHUB ACTIONS FREE TIER:
#   2,000 minutes/month for private repos — plenty for this project.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Python / FastAPI ──────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: python -m ruff check app/ --config ruff.toml

      - name: Type check with mypy
        working-directory: backend
        run: python -m mypy app/ --config-file mypy.ini

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest -x -q --cov=app/services --cov=app/api/routes --cov-fail-under=80

      - name: Security scan with bandit
        working-directory: backend
        run: python -m bandit -c bandit.yaml -r app/

      - name: Scan for secrets
        run: python -m detect_secrets scan --exclude-files '\.env$|venv/|node_modules/|\.next/|tsconfig\.tsbuildinfo$|package-lock\.json$' --list-all-plugins > /dev/null

      - name: Audit dependencies for CVEs
        working-directory: backend
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt

      - name: Verify FastAPI app starts
        working-directory: backend
        run: |
          python -c "
          from app.main import app
          routes = list(app.openapi()['paths'].keys())
          expected = ['/api/v1/analyze', '/api/v1/score', '/api/v1/gap',
                      '/api/v1/compliance', '/api/v1/summary', '/api/v1/rewrite',
                      '/api/v1/export/pdf', '/api/v1/cover-letter', '/health']
          for path in expected:
              assert path in routes, f'Missing route: {path}'
          print(f'All {len(expected)} expected routes registered')
          "

  # ── Frontend: Next.js / TypeScript ────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit npm dependencies for CVEs
        working-directory: frontend
        # Production dependencies are deployed. Auditing dev-only lint tooling here
        # previously required a breaking transitive override that made ESLint crash.
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js app
        working-directory: frontend
        # 'npm run build' does two things at once:
        # 1. TypeScript type checking — catches type errors
        # 2. Next.js page compilation — catches broken imports and JSX errors
        # If any of these fail, the build fails and CI blocks the PR.
        env:
          # Set a dummy API URL so NEXT_PUBLIC_API_URL is defined during build.
          # The real URL is set in Vercel's environment variable settings.
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

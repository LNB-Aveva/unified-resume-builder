name: Keepalive

on:
  schedule:
    - cron: "*/14 * * * *"

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render backend
        run: |
          # A non-zero exit fails the workflow so GitHub notifies the repository owner.
          status=$(curl --fail --silent --show-error --output /dev/null \
            --write-out "%{http_code}" --max-time 30 "${BACKEND_URL}/health")
          if [ "$status" != "200" ]; then
            echo "::error::Backend health check returned HTTP $status"
            exit 1
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://unified-resume-builder-api.onrender.com' }}

name: Keepalive

on:
  schedule:
    # Hourly — verifies backend health and runs retention cleanup.
    # Render Starter does not sleep; UptimeRobot provides independent alerting.
    # Hourly is sufficient: no cold-start prevention needed on Starter.
    - cron: "0 * * * *"

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake up Render backend
        run: |
          # Retry transient network/deploy interruptions before failing.
          for attempt in 1 2 3; do
            status=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" --max-time 90 "${BACKEND_URL}/health" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status — retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend health check failed after 3 attempts (last HTTP $status)"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://unified-resume-builder-api.onrender.com' }}

  cleanup:
    name: Cleanup expired shared scores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete expired rows
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${FRONTEND_URL}/api/cron/cleanup" || true)
          if [ "$status" = "200" ]; then
            echo "Cleanup succeeded"
          else
            echo "::error::Cleanup returned HTTP $status"
            exit 1
          fi
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://resumeai.cv' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
